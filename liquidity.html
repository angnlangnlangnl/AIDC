<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SpaceX MEME 铸造</title>
    <style>
        /* 基础重置 */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body { background-color: #050505; color: #ffffff; padding-bottom: 80px; }

        /* 通用组件 */
        .btn-primary {
            background: linear-gradient(90deg, #f7971e 0%, #ffd200 100%);
            border: none;
            color: #000;
            font-weight: bold;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(255, 210, 0, 0.2);
            transition: transform 0.2s;
        }
        .btn-primary:active { transform: scale(0.96); }
        
        .gold-border-card {
            background: rgba(10, 10, 10, 0.8);
            border: 1px solid #333;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            position: relative;
            /* 模拟角落金色装饰 */
            box-shadow: inset 0 0 20px rgba(255, 210, 0, 0.02);
        }
        .gold-border-card::before, .gold-border-card::after {
            content: ''; position: absolute; width: 15px; height: 15px; border-color: #f7971e; border-style: solid; pointer-events: none;
        }
        .gold-border-card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
        .gold-border-card::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

        /* 头部导航 */
        .header {
            position: sticky; top: 0; z-index: 100;
            display: flex; justify-content: space-between; align-items: center;
            padding: 15px 20px; background: rgba(5,5,5,0.9); backdrop-filter: blur(10px);
            border-bottom: 1px solid #222;
        }
        .header .logo { display: flex; align-items: center; font-weight: bold; font-size: 18px; }
        .header .logo span { color: #f7971e; margin-right: 5px; }
        .header .logo img { width: 24px; height: 24px; margin-right: 8px; }
        
        .lang-switch { background: #1a1a1a; padding: 4px 10px; border-radius: 6px; font-size: 12px; border: 1px solid #333; margin-right: 10px; }
        .btn-connect { background: transparent; border: 1px solid #f7971e; color: #f7971e; padding: 8px 16px; border-radius: 6px; font-size: 14px; cursor: pointer; }

        /* 主图/引导区 */
        .hero-section { text-align: center; padding: 30px 20px 20px; }
        .hero-section h1 { font-size: 18px; line-height: 1.4; margin-bottom: 5px; }
        .hero-section .subtitle { color: #888; font-size: 14px; margin-bottom: 20px; }
        
        /* 火箭占位图 */
        .rocket-container { position: relative; height: 180px; margin: 20px 0; display: flex; justify-content: center; }
        .rocket-container img { height: 100%; object-fit: contain; filter: drop-shadow(0 20px 30px rgba(255, 100, 0, 0.4)); }

        /* 进度卡片 */
        .progress-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 5px; }
        .progress-track { width: 100%; height: 10px; background: #1a1a1a; border-radius: 5px; overflow: hidden; border: 1px solid #333; margin: 8px 0 15px; }
        .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #f7971e, #ffd200); transition: width 1s ease-in-out; }
        .price-info { display: flex; justify-content: space-between; font-size: 12px; color: #aaa; border-top: 1px solid #222; padding-top: 10px; }
        .price-info .percent { color: #fff; font-weight: bold; font-size: 20px; }

        /* 铸造卡片 */
        .mint-header { text-align: center; color: #f7971e; font-weight: bold; font-size: 16px; margin-bottom: 15px; }
        .mint-status { color: #4CAF50; font-size: 12px; margin-top: 2px; }

        .input-group { background: #0a0a0a; border: 1px solid #222; border-radius: 8px; padding: 15px; margin-bottom: 12px; }
        .input-label { display: flex; justify-content: space-between; font-size: 13px; color: #ccc; margin-bottom: 10px; }
        .input-flex { display: flex; justify-content: space-between; align-items: center; }
        .coin-pill { display: flex; align-items: center; background: #1a1a1a; padding: 5px 10px; border-radius: 20px; border: 1px solid #333; font-size: 14px; font-weight: bold; }
        .coin-pill img { width: 16px; height: 16px; margin-right: 6px; }
        
        .input-number { background: transparent; border: none; color: #fff; font-size: 20px; font-weight: bold; width: 60%; text-align: right; outline: none; }
        .input-number::placeholder { color: #555; }

        .swap-icon { text-align: center; margin: -5px 0; position: relative; z-index: 2; }
        .swap-icon span { background: #1a1a1a; padding: 5px 10px; border-radius: 50%; border: 1px solid #333; display: inline-block; }

        /* 底部数据卡片 */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 10px; }
        .stat-item { text-align: center; }
        .stat-item img { width: 20px; height: 20px; margin-bottom: 4px; opacity: 0.8; }
        .stat-item .label { font-size: 10px; color: #888; }
        .stat-item .value { font-size: 14px; font-weight: bold; margin-top: 2px; }

        /* 底部导航 */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: #0a0a0a; border-top: 1px solid #222;
            display: flex; justify-content: space-around; padding: 10px 0 25px; z-index: 200;
        }
        .nav-item { text-align: center; color: #666; font-size: 10px; cursor: pointer; transition: color 0.3s; }
        .nav-item.active { color: #f7971e; }
        .nav-item svg { width: 24px; height: 24px; fill: currentColor; margin-bottom: 4px; }

        /* 弹窗 (Toast) */
        .toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.9); border: 1px solid #f7971e; padding: 15px 25px;
            border-radius: 8px; display: none; z-index: 300;
            text-align: center; font-size: 14px;
        }
        .toast.show { display: block; animation: fadeInUp 0.4s ease-out; }
        @keyframes fadeInUp { from { opacity: 0; transform: translateX(-50%) translateY(20px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
    </style>
</head>
<body>

    <!-- 顶部导航 -->
    <header class="header">
        <div class="logo">
            <!-- 使用简单图标占位 -->
            <span style="color:#fff; font-weight:900; font-style:italic;">S</span>PACEX
        </div>
        <div>
            <span class="lang-switch">🇺🇸 ZH ⌄</span>
            <button class="btn-connect" onclick="toggleWallet()">連接錢包</button>
        </div>
    </header>

    <!-- 主视觉区 -->
    <section class="hero-section">
        <h1>全球首個星艦粉絲群發射的AI智能體代幣</h1>
        <div class="subtitle">星艦屬於每一個仰望星空的人</div>
        <div class="rocket-container">
            <!-- 模拟火箭图片 -->
            <img src="https://img.freepik.com/free-psd/rocket-launch-3d-illustration_23-2151192275.jpg?w=740" alt="Rocket" style="border-radius: 50%; box-shadow: 0 0 30px rgba(255,165,0,0.3);">
        </div>
    </section>

    <!-- 铸造进度卡片 -->
    <div style="padding: 0 15px;">
        <div class="gold-border-card">
            <div class="progress-row">
                <span>鑄造進度</span>
                <span>完成指標</span>
            </div>
            <div class="progress-row" style="font-size: 14px; color: #fff;">
                <span id="minted-amount">0.00 SPACEX</span>
                <span id="target-amount">0.00/0 BNB</span>
            </div>
            
            <div class="progress-track">
                <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
            </div>

            <div class="price-info">
                <span>鑄造價格 = $0.000195</span>
                <span class="percent" id="progress-percent">0.00%</span>
            </div>
        </div>
    </div>

    <!-- 铸造面板 -->
    <div style="padding: 0 15px;">
        <div class="gold-border-card">
            <div class="mint-header">
                鑄造 $SPACEX
                <div class="mint-status">● PRESALE LIVE</div>
            </div>

            <!-- 支付区域 -->
            <div class="input-group">
                <div class="input-label">
                    <span>需要支付</span>
                    <span id="wallet-balance">錢包餘額: 0.00 BNB</span>
                </div>
                <div class="input-flex">
                    <div class="coin-pill">
                        <img src="https://cryptologos.cc/logos/bnb-bnb-logo.png?v=026" alt="BNB"> BNB
                    </div>
                    <input type="number" class="input-number" id="pay-amount" placeholder="輸入最低 0.1BNB" step="0.1">
                </div>
            </div>

            <!-- 切换按钮 -->
            <div class="swap-icon"><span>⇅</span></div>

            <!-- 接收区域 -->
            <div class="input-group">
                <div class="input-label">
                    <span>可以接收</span>
                </div>
                <div class="input-flex">
                    <div class="coin-pill">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/29/SpaceX_logo_black.svg/2560px-SpaceX_logo_black.svg.png" style="background:#fff; border-radius:50%; padding:2px;" alt="SPACEX"> SPACEX
                    </div>
                    <span class="input-number" id="receive-amount" style="cursor:default; font-weight:normal;">0</span>
                </div>
            </div>

            <button class="btn-primary" onclick="startMint()">立刻鑄造</button>
        </div>
    </div>

    <!-- 底部数据 -->
    <div style="padding: 0 15px;">
        <div class="gold-border-card">
            <div class="stats-grid">
                <div class="stat-item">
                    <div>🚀</div>
                    <div class="label">發行量</div>
                    <div class="value">100,000M</div>
                </div>
                <div class="stat-item">
                    <div>👤</div>
                    <div class="label">持有地址</div>
                    <div class="value">∞</div>
                </div>
                <div class="stat-item">
                    <div>📈</div>
                    <div class="label">現價</div>
                    <div class="value">$0.000195</div>
                </div>
                <div class="stat-item">
                    <div>🔄</div>
                    <div class="label">預售</div>
                    <div class="value">10%</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 底部导航 -->
    <div class="bottom-nav">
        <div class="nav-item active">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zm0 9l2.5-1.25L12 8.5l-2.5 1.25L12 11zm0 2.5l-5-2.5-5 2.5L12 22l10-8.5-5-2.5-5 2.5z"/></svg>
            <div>鑄造</div>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
            <div>邀請</div>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
            <div>任務</div>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
            <div>NFTs</div>
        </div>
        <div class="nav-item">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm-1-13h2v6h-2zm0 8h2v2h-2z"/></svg>
            <div>生態</div>
        </div>
    </div>

    <!-- 模拟提示弹窗 -->
    <div class="toast" id="mint-toast">
        <div style="font-weight:bold; color:#ffd200; margin-bottom:5px;">鑄造成功！</div>
        <div style="font-size:12px; color:#ccc;">正在處理鏈上交易，請稍候...</div>
    </div>

    <script>
        // 模拟钱包连接
        function toggleWallet() {
            const btn = document.querySelector('.btn-connect');
            const balanceEl = document.getElementById('wallet-balance');
            if(btn.innerText === '連接錢包') {
                btn.innerText = '0x1234...ABCD';
                balanceEl.innerText = '錢包餘額: 12.50 BNB';
                btn.style.background = '#f7971e';
                btn.style.color = '#000';
                btn.style.border = 'none';
            } else {
                btn.innerText = '連接錢包';
                balanceEl.innerText = '錢包餘額: 0.00 BNB';
                btn.style.background = 'transparent';
                btn.style.color = '#f7971e';
                btn.style.border = '1px solid #f7971e';
            }
        }

        // 开始铸造动画
        function startMint() {
            const input = document.getElementById('pay-amount');
            const val = parseFloat(input.value);
            
            if (!val || val <= 0) {
                alert("請輸入有效的 BNB 數量（最低 0.1）");
                return;
            }

            // 模拟计算接收数量 (假设 1 BNB = 5000 SPACEX)
            const receiveEl = document.getElementById('receive-amount');
            const receiveVal = val * 5000;
            receiveEl.innerText = receiveVal.toLocaleString();

            // 进度条动画
            const fill = document.getElementById('progress-fill');
            const percentText = document.getElementById('progress-percent');
            const mintedText = document.getElementById('minted-amount');
            
            // 模拟进度从当前值增加
            let currentWidth = parseFloat(fill.style.width) || 0;
            let increment = Math.min(35, 100 - currentWidth); // 每次增加一点
            let newWidth = Math.min(currentWidth + increment, 100);
            
            fill.style.width = newWidth + '%';
            percentText.innerText = newWidth.toFixed(2) + '%';
            mintedText.innerText = (newWidth * 10000).toFixed(2) + ' SPACEX';

            // 显示提示
            const toast = document.getElementById('mint-toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // 自动监听输入框变化计算接收数量（增加体验）
        document.getElementById('pay-amount').addEventListener('input', function(e) {
            const val = parseFloat(e.target.value);
            const receiveEl = document.getElementById('receive-amount');
            if (val && val > 0) {
                receiveEl.innerText = (val * 5000).toLocaleString();
            } else {
                receiveEl.innerText = '0';
            }
        });
    </script>
</body>
</html>
