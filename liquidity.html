<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>铸造 - AIDC</title>
    <style>
        /* ============================================================
                   全局重置 & 主题色 — 与AIDC项目统一
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-color: #050B15;
            --card-bg: rgba(8, 20, 48, 0.4);
            --border-color: rgba(0, 136, 255, 0.15);

            --text-primary: #FFFFFF;
            --text-primary-soft: #E2F0FB;
            --text-secondary: #8AA9C9;
            --text-dim: rgba(255, 255, 255, 0.45);

            --cyan-glow: #00DDFF;
            --cyan-dim: #0088FF;

            --gold: #f5c842;
            --gold-glow: rgba(245, 200, 66, 0.6);
            --gold-dim: rgba(245, 200, 66, 0.2);
            --gold-border: rgba(245, 200, 66, 0.3);

            --aidc-blue: #00DDFF;
            --aidc-blue-dim: #0088FF;
            --aidc-blue-glow: rgba(0, 221, 255, 0.5);
            --aidc-blue-border: rgba(0, 221, 255, 0.3);
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            color: var(--text-primary);
            padding: 0;
            margin: 0;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            min-height: 100vh;
            min-height: 100dvh;
            background: radial-gradient(circle at 50% 10%, #102040 0%, #050B15 100%);
            box-shadow: 0 0 40px rgba(0, 136, 255, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
            padding-bottom: 80px;
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://raw.githubusercontent.com/angnlangnlangnl/AIDC/main/images/bg.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            opacity: 1;
            z-index: 0;
            pointer-events: none;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
                   Header — 与AIDC项目一致
                   ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px 15px 20px;
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 11, 21, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 221, 255, 0.1);
        }
        .logo-area {
            display: flex;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }
        .logo-area img {
            width: 24px;
            height: 24px;
            margin-right: 8px;
        }
        .logo-area .logo-text {
            background: linear-gradient(90deg, #0088FF, #00DDFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .logo-area .logo-spacex {
            color: var(--gold);
            font-weight: 900;
            font-style: italic;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid rgba(0, 221, 255, 0.3);
            color: #00DDFF;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }
        .lang-btn:hover {
            box-shadow: 0 0 15px rgba(0, 221, 255, 0.4);
            background: rgba(0, 221, 255, 0.1);
        }

        .connect-btn {
            background: transparent;
            border: 1px solid rgba(0, 221, 255, 0.3);
            color: #00DDFF;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 221, 255, 0.05);
            transition: all 0.3s;
            white-space: nowrap;
        }
        .connect-btn:hover {
            box-shadow: 0 0 25px rgba(0, 221, 255, 0.25);
            background: rgba(0, 221, 255, 0.08);
        }
        .connect-btn.connected {
            background: rgba(0, 221, 255, 0.12);
            border-color: #00DDFF;
            color: #00DDFF;
            box-shadow: 0 0 20px rgba(0, 221, 255, 0.2);
        }

        /* ============================================================
                   ★★★ 金色断点科技边框风格 — 与AIDC项目一致 ★★★
                   ============================================================ */

        .gold-break-card {
            position: relative;
            background: rgba(0, 16, 40, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 18px 16px;
            margin-bottom: 15px;
            clip-path: polygon(
                8px 0%,
                calc(100% - 8px) 0%,
                100% 8px,
                100% calc(100% - 8px),
                calc(100% - 8px) 100%,
                8px 100%,
                0% calc(100% - 8px),
                0% 8px
            );
            transition: all 0.3s;
        }
        .gold-break-card .card-inner {
            clip-path: polygon(
                8px 0%,
                calc(100% - 8px) 0%,
                100% 8px,
                100% calc(100% - 8px),
                calc(100% - 8px) 100%,
                8px 100%,
                0% calc(100% - 8px),
                0% 8px
            );
            padding: 2px;
        }

        .gold-break-card::before,
        .gold-break-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            clip-path: inherit;
            background: transparent;
            border-radius: 16px;
        }

        /* 外层边框：金色 · 0.75px · 断点 30%-70% */
        .gold-break-card::before {
            background-image:
                linear-gradient(90deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(180deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(270deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(0deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%);
            background-size:
                100% 0.75px,
                0.75px 100%,
                100% 0.75px,
                0.75px 100%;
            background-position:
                0 0,
                100% 0,
                0 100%,
                0 0;
            background-repeat: no-repeat;
            filter: drop-shadow(0 0 4px rgba(245, 200, 66, 0.3));
            opacity: 0.9;
            animation: goldPulse 4s infinite alternate ease-in-out;
        }

        /* 内层边框：蓝色 · 0.75px · 断点错位 15%-55% */
        .gold-break-card::after {
            background-image:
                linear-gradient(90deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(180deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(270deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(0deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%);
            background-size:
                100% 0.75px,
                0.75px 100%,
                100% 0.75px,
                0.75px 100%;
            background-position:
                6px 6px,
                calc(100% - 6px) 6px,
                6px calc(100% - 6px),
                6px 6px;
            background-repeat: no-repeat;
            filter: drop-shadow(0 0 6px rgba(0, 180, 255, 0.35));
            opacity: 0.9;
            animation: bluePulse 5s infinite alternate-reverse ease-in-out;
        }

        /* 四角金色装饰 (L型小线段) */
        .gold-break-card .corner-deco {
            position: absolute;
            z-index: 3;
            width: 12px;
            height: 12px;
            background: transparent;
            pointer-events: none;
        }
        .gold-break-card .corner-deco::before,
        .gold-break-card .corner-deco::after {
            content: '';
            position: absolute;
            background: #f5c842;
            box-shadow: 0 0 8px rgba(245, 200, 66, 0.4);
            border-radius: 0;
        }
        .gold-break-card .corner-deco.tl {
            top: 3px;
            left: 3px;
        }
        .gold-break-card .corner-deco.tl::before {
            top: 0;
            left: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-card .corner-deco.tl::after {
            top: 0;
            left: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }
        .gold-break-card .corner-deco.tr {
            top: 3px;
            right: 3px;
        }
        .gold-break-card .corner-deco.tr::before {
            top: 0;
            right: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-card .corner-deco.tr::after {
            top: 0;
            right: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }
        .gold-break-card .corner-deco.bl {
            bottom: 3px;
            left: 3px;
        }
        .gold-break-card .corner-deco.bl::before {
            bottom: 0;
            left: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-card .corner-deco.bl::after {
            bottom: 0;
            left: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }
        .gold-break-card .corner-deco.br {
            bottom: 3px;
            right: 3px;
        }
        .gold-break-card .corner-deco.br::before {
            bottom: 0;
            right: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-card .corner-deco.br::after {
            bottom: 0;
            right: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }

        /* 脉动动画 */
        @keyframes goldPulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        @keyframes bluePulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.9; }
            100% { opacity: 0.3; }
        }

        /* ============================================================
                   内容样式
                   ============================================================ */

        /* 主视觉区 */
        .hero-section {
            text-align: center;
            padding: 10px 0 15px;
        }
        .hero-section h1 {
            font-size: 18px;
            line-height: 1.4;
            margin-bottom: 5px;
            color: var(--text-primary);
        }
        .hero-section .subtitle {
            color: var(--text-secondary);
            font-size: 14px;
            margin-bottom: 15px;
        }

        .rocket-container {
            position: relative;
            height: 160px;
            margin: 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .rocket-container img {
            height: 100%;
            object-fit: contain;
            filter: drop-shadow(0 0 40px rgba(245, 200, 66, 0.3));
            border-radius: 50%;
        }

        /* 进度条 */
        .progress-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 4px;
            color: var(--text-secondary);
        }
        .progress-row .highlight {
            color: var(--text-primary);
        }
        .progress-track {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.06);
            margin: 6px 0 12px;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f5c842, #ffd700);
            transition: width 1s ease-in-out;
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(245, 200, 66, 0.3);
        }

        .price-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 10px;
        }
        .price-info .percent {
            color: var(--gold);
            font-weight: bold;
            font-size: 18px;
        }

        /* 铸造标题 */
        .mint-header {
            text-align: center;
            color: var(--gold);
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 15px;
        }
        .mint-status {
            color: #4CAF50;
            font-size: 12px;
            margin-top: 2px;
        }

        /* 输入组 */
        .input-group {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 8px;
            padding: 12px 15px;
            margin-bottom: 12px;
        }
        .input-label {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }
        .input-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .coin-pill {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 10px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .coin-pill img {
            width: 18px;
            height: 18px;
            margin-right: 6px;
            border-radius: 50%;
        }

        .input-number {
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-size: 20px;
            font-weight: bold;
            width: 60%;
            text-align: right;
            outline: none;
        }
        .input-number::placeholder {
            color: rgba(255, 255, 255, 0.25);
        }
        .input-number.receive {
            font-weight: normal;
            font-size: 18px;
            cursor: default;
        }

        .swap-icon {
            text-align: center;
            margin: -6px 0;
            position: relative;
            z-index: 2;
        }
        .swap-icon span {
            background: rgba(0, 16, 40, 0.8);
            padding: 4px 12px;
            border-radius: 50%;
            border: 1px solid rgba(245, 200, 66, 0.3);
            display: inline-block;
            color: var(--gold);
            font-size: 14px;
        }

        /* 按钮 — 金色断点风格 */
        .btn-gold {
            display: inline-block;
            padding: 12px 24px;
            border: 1px solid #f5c842;
            border-radius: 0;
            font-size: 0.95rem;
            letter-spacing: 3px;
            color: #f5c842;
            background: rgba(245, 200, 66, 0.08);
            clip-path: polygon(6px 0%, calc(100% - 6px) 0%, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0% calc(100% - 6px), 0% 6px);
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(245, 200, 66, 0.05);
        }
        .btn-gold:hover {
            background: rgba(245, 200, 66, 0.18);
            box-shadow: 0 0 30px rgba(245, 200, 66, 0.2);
            transform: translateY(-2px);
        }
        .btn-gold:active {
            transform: translateY(0px);
        }

        /* 底部数据网格 */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 8px;
        }
        .stat-item {
            text-align: center;
        }
        .stat-item .icon {
            font-size: 20px;
            margin-bottom: 2px;
        }
        .stat-item .label {
            font-size: 10px;
            color: var(--text-secondary);
        }
        .stat-item .value {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-primary);
            margin-top: 2px;
        }

        /* ============================================================
                   底部导航 — 与AIDC项目一致
                   ============================================================ */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            max-width: 420px;
            margin: 0 auto;
            right: 0;
            background: rgba(5, 11, 21, 0.85);
            backdrop-filter: blur(12px);
            border-top: 1px solid rgba(0, 136, 255, 0.15);
            display: flex;
            justify-content: space-around;
            padding: 12px 0 20px;
            z-index: 200;
            border-radius: 20px 20px 0 0;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.8);
        }
        .bottom-nav::before {
            content: '';
            position: absolute;
            top: -1px;
            left: 0;
            right: 0;
            border-radius: 20px 20px 0 0;
            padding: 1px;
            background: linear-gradient(135deg, var(--gold), transparent, var(--gold));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.4;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary);
            font-size: 11px;
            gap: 4px;
            cursor: pointer;
            padding: 5px 10px;
            transition: all 0.3s ease;
            text-decoration: none;
            background: none;
            border: none;
        }
        .nav-item .nav-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }
        .nav-item.active {
            color: var(--gold);
            position: relative;
        }
        .nav-item.active::after {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: linear-gradient(to right, var(--gold), #d4a830);
            border-radius: 5px;
            box-shadow: 0 0 15px var(--gold-glow);
        }
        .nav-item:not(.active):hover {
            color: var(--gold);
        }

        /* ============================================================
                   弹窗 (Toast)
                   ============================================================ */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 16, 40, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid var(--gold-border);
            padding: 16px 28px;
            border-radius: 12px;
            display: none;
            z-index: 300;
            text-align: center;
            font-size: 14px;
            max-width: 90%;
            clip-path: polygon(6px 0%, calc(100% - 6px) 0%, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0% calc(100% - 6px), 0% 6px);
        }
        .toast.show {
            display: block;
            animation: fadeInUp 0.4s ease-out;
        }
        .toast .title {
            font-weight: bold;
            color: var(--gold);
            margin-bottom: 4px;
        }
        .toast .desc {
            font-size: 12px;
            color: var(--text-secondary);
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ============================================================
                   响应式
                   ============================================================ */
        @media (max-width: 600px) {
            .hero-section h1 {
                font-size: 16px;
            }
            .stats-grid {
                grid-template-columns: 1fr 1fr 1fr 1fr;
                gap: 4px;
            }
            .stat-item .value {
                font-size: 12px;
            }
            .gold-break-card {
                padding: 14px 12px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="scroll-area">

            <!-- ===== Header ===== -->
            <header class="header">
                <div class="logo-area">
                    <img src="https://raw.githubusercontent.com/angnlangnlangnl/AIDC/main/images/aidc.png" alt="AIDC">
                    <span class="logo-text">AIDC</span>
                    <span style="margin:0 4px;color:var(--text-secondary);font-weight:300;">×</span>
                    <span class="logo-spacex">SPACEX</span>
                </div>
                <div class="header-controls">
                    <button class="lang-btn">🇨🇳 CN ⌄</button>
                    <button class="connect-btn" onclick="toggleWallet()">连接钱包</button>
                </div>
            </header>

            <!-- ===== 主视觉区 ===== -->
            <section class="hero-section">
                <h1>全球首个星舰粉丝群发射的AI智能体代币</h1>
                <div class="subtitle">星舰属于每一个仰望星空的人</div>
                <div class="rocket-container">
                    <img src="https://img.freepik.com/free-psd/rocket-launch-3d-illustration_23-2151192275.jpg?w=740" alt="Rocket">
                </div>
            </section>

            <!-- ==========================================================
            ★★★ 铸造进度卡片 (金色断点风格) ★★★
            ========================================================== -->
            <div class="gold-break-card">
                <div class="corner-deco tl"></div>
                <div class="corner-deco tr"></div>
                <div class="corner-deco bl"></div>
                <div class="corner-deco br"></div>
                <div class="card-inner">
                    <div class="progress-row">
                        <span>铸造进度</span>
                        <span>完成指标</span>
                    </div>
                    <div class="progress-row" style="font-size: 14px; color: var(--text-primary);">
                        <span id="minted-amount">0.00 AIDC</span>
                        <span id="target-amount">0.00/0 BNB</span>
                    </div>

                    <div class="progress-track">
                        <div class="progress-fill" id="progress-fill" style="width: 0%;"></div>
                    </div>

                    <div class="price-info">
                        <span>铸造价格 = $0.000195</span>

    <script>
        // ============================================================
        // 钱包连接
        // ============================================================
        function toggleWallet() {
            const btn = document.querySelector('.connect-btn');
            const balanceEl = document.getElementById('wallet-balance');
            if (btn.textContent === '连接钱包') {
                btn.textContent = '0x1234...ABCD';
                balanceEl.textContent = '钱包余额: 12.50 BNB';
                btn.classList.add('connected');
            } else {
                btn.textContent = '连接钱包';
                balanceEl.textContent = '钱包余额: 0.00 BNB';
                btn.classList.remove('connected');
            }
        }

        // ============================================================
        // 铸造逻辑
        // ============================================================
        function startMint() {
            const input = document.getElementById('pay-amount');
            const val = parseFloat(input.value);

            if (!val || val <= 0) {
                alert("请输入有效的 BNB 数量（最低 0.1）");
                return;
            }

            // 模拟计算接收数量 (1 BNB = 5000 AIDC)
            const receiveEl = document.getElementById('receive-amount');
            const receiveVal = val * 5000;
            receiveEl.textContent = receiveVal.toLocaleString();

            // 进度条动画
            const fill = document.getElementById('progress-fill');
            const percentText = document.getElementById('progress-percent');
            const mintedText = document.getElementById('minted-amount');

            let currentWidth = parseFloat(fill.style.width) || 0;
            let increment = Math.min(35, 100 - currentWidth);
            let newWidth = Math.min(currentWidth + increment, 100);

            fill.style.width = newWidth + '%';
            percentText.textContent = newWidth.toFixed(2) + '%';
            mintedText.textContent = (newWidth * 10000).toFixed(2) + ' AIDC';

            // 显示提示
            const toast = document.getElementById('mint-toast');
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        // ============================================================
        // 自动计算接收数量
        // ============================================================
        document.getElementById('pay-amount').addEventListener('input', function(e) {
            const val = parseFloat(e.target.value);
            const receiveEl = document.getElementById('receive-amount');
            if (val && val > 0) {
                receiveEl.textContent = (val * 5000).toLocaleString();
            } else {
                receiveEl.textContent = '0';
            }
        });
    </script>
