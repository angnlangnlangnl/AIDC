<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>流动性 - AIDC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js">
    </script>
    <style>
        /* ============================================================
                   全局重置 & 主题色 — 与生态页完全一致
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-color: #050B15;
            --card-bg: rgba(8, 20, 48, 0.4);
            --border-color: rgba(0, 136, 255, 0.15);

            --text-primary: #FFFFFF;
            --text-primary-soft: #E2F0FB;
            --text-secondary: #8AA9C9;
            --text-dim: rgba(255, 255, 255, 0.45);

            --cyan-glow: #00DDFF;
            --cyan-dim: #0088FF;

            --gold: #f5c842;
            --gold-glow: rgba(245, 200, 66, 0.6);
            --gold-dim: rgba(245, 200, 66, 0.2);
            --gold-border: rgba(245, 200, 66, 0.3);

            --aidc-blue: #00DDFF;
            --aidc-blue-dim: #0088FF;
            --aidc-blue-glow: rgba(0, 221, 255, 0.5);
            --aidc-blue-border: rgba(0, 221, 255, 0.3);
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            color: var(--text-primary);
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 100vh;
            max-height: 100dvh;
            background: radial-gradient(circle at 50% 10%, #102040 0%, #050B15 100%);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 136, 255, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://raw.githubusercontent.com/angnlangnlangnl/AIDC/main/images/bg.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            opacity: 1;
            z-index: 0;
            pointer-events: none;
            border-radius: 20px;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
                   Header — 与生态页完全一致
                   ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            position: relative;
        }
        .logo-area {
            display: flex;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }
        .logo-area img {
            width: 24px;
            height: 24px;
            margin-right: 5px;
        }
        .logo-area span {
            margin-left: 5px;
            background: linear-gradient(90deg, #0088FF, #00DDFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid rgba(0, 221, 255, 0.3);
            color: #00DDFF;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }
        .lang-btn:hover {
            box-shadow: 0 0 15px rgba(0, 221, 255, 0.4);
            background: rgba(0, 221, 255, 0.1);
        }
        .lang-btn.active {
            background: rgba(0, 221, 255, 0.15);
            border-color: #00DDFF;
            color: #00DDFF;
        }

        .lang-dropdown {
            display: none;
            position: absolute;
            top: 35px;
            right: 0;
            background: rgba(8, 20, 48, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 221, 255, 0.2);
            border-radius: 12px;
            padding: 12px;
            width: 200px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            z-index: 999;
            flex-direction: column;
            gap: 6px;
        }
        .lang-dropdown.open {
            display: flex;
        }
        .lang-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--text-primary-soft);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-option:hover {
            background: rgba(0, 221, 255, 0.1);
            color: #00DDFF;
        }
        .lang-option .code {
            color: #00DDFF;
            font-size: 12px;
            font-weight: 500;
            margin-left: 8px;
        }

        .connect-btn {
            background: transparent;
            border: 1px solid rgba(0, 221, 255, 0.3);
            color: #00DDFF;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 221, 255, 0.05);
            transition: all 0.3s;
            white-space: nowrap;
        }
        .connect-btn:hover:not(:disabled) {
            box-shadow: 0 0 25px rgba(0, 221, 255, 0.25);
            background: rgba(0, 221, 255, 0.08);
        }
        .connect-btn.connected {
            background: rgba(0, 221, 255, 0.12);
            border-color: #00DDFF;
            color: #00DDFF;
            box-shadow: 0 0 20px rgba(0, 221, 255, 0.2);
        }
        .connect-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ============================================================
                   ★★★ 金色断点科技边框风格 — 与生态页完全一致 ★★★
                   ============================================================ */

        .gold-break-panel {
            position: relative;
            background: rgba(0, 16, 40, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            clip-path: polygon(
                8px 0%,
                calc(100% - 8px) 0%,
                100% 8px,
                100% calc(100% - 8px),
                calc(100% - 8px) 100%,
                8px 100%,
                0% calc(100% - 8px),
                0% 8px
            );
            transition: all 0.3s;
        }
        .gold-break-panel .panel-inner {
            clip-path: polygon(
                8px 0%,
                calc(100% - 8px) 0%,
                100% 8px,
                100% calc(100% - 8px),
                calc(100% - 8px) 100%,
                8px 100%,
                0% calc(100% - 8px),
                0% 8px
            );
            padding: 2px;
        }

        .gold-break-panel::before,
        .gold-break-panel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            clip-path: inherit;
            background: transparent;
            border-radius: 16px;
        }

        .gold-break-panel::before {
            background-image:
                linear-gradient(90deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(180deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(270deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(0deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%);
            background-size:
                100% 0.75px,
                0.75px 100%,
                100% 0.75px,
                0.75px 100%;
            background-position:
                0 0,
                100% 0,
                0 100%,
                0 0;
            background-repeat: no-repeat;
            filter: drop-shadow(0 0 4px rgba(245, 200, 66, 0.3));
            opacity: 0.9;
            animation: goldPulse 4s infinite alternate ease-in-out;
        }

        .gold-break-panel::after {
            background-image:
                linear-gradient(90deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(180deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(270deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(0deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%);
            background-size:
                100% 0.75px,
                0.75px 100%,
                100% 0.75px,
                0.75px 100%;
            background-position:
                6px 6px,
                calc(100% - 6px) 6px,
                6px calc(100% - 6px),
                6px 6px;
            background-repeat: no-repeat;
            filter: drop-shadow(0 0 6px rgba(0, 180, 255, 0.35));
            opacity: 0.9;
            animation: bluePulse 5s infinite alternate-reverse ease-in-out;
        }

        /* 四角金色装饰 */
        .gold-break-panel .corner-deco {
            position: absolute;
            z-index: 3;
            width: 12px;
            height: 12px;
            background: transparent;
            pointer-events: none;
        }
        .gold-break-panel .corner-deco::before,
        .gold-break-panel .corner-deco::after {
            content: '';
            position: absolute;
            background: #f5c842;
            box-shadow: 0 0 8px rgba(245, 200, 66, 0.4);
            border-radius: 0;
        }
        .gold-break-panel .corner-deco.tl {
            top: 3px;
            left: 3px;
        }
        .gold-break-panel .corner-deco.tl::before {
            top: 0;
            left: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.tl::after {
            top: 0;
            left: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.tr {
            top: 3px;
            right: 3px;
        }
        .gold-break-panel .corner-deco.tr::before {
            top: 0;
            right: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.tr::after {
            top: 0;
            right: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.bl {
            bottom: 3px;
            left: 3px;
        }
        .gold-break-panel .corner-deco.bl::before {
            bottom: 0;
            left: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.bl::after {
            bottom: 0;
            left: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.br {
            bottom: 3px;
            right: 3px;
        }
        .gold-break-panel .corner-deco.br::before {
            bottom: 0;
            right: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.br::after {
            bottom: 0;
            right: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }

        @keyframes goldPulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
        @keyframes bluePulse {
            0% { opacity: 0.3; }
            50% { opacity: 0.9; }
            100% { opacity: 0.3; }
        }

        /* ============================================================
                   页面标题
                   ============================================================ */
        .page-title {
            font-size: 24px;
            text-align: center;
            margin: 10px 0 20px;
            color: var(--text-primary);
            font-weight: 600;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .page-title img {
            width: 28px;
            height: 28px;
            object-fit: contain;
        }

        /* ============================================================
                   流动性内容样式
                   ============================================================ */
        .pool-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }
        .pool-info:last-child {
            border-bottom: none;
        }
        .pool-label {
            color: var(--text-secondary);
            font-size: 13px;
        }
        .pool-value {
            color: var(--text-primary);
            font-size: 14px;
            font-weight: 600;
        }
        .pool-value .highlight {
            color: var(--gold);
        }

        .lp-token-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
        }
        .lp-token-row img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
        }
        .lp-token-row .info {
            flex: 1;
        }
        .lp-token-row .info .name {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }
        .lp-token-row .info .balance {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .lp-token-row .amount {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .btn-secondary {
            display: inline-block;
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            text-align: center;
        }
        .btn-secondary:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        /* ============================================================
                   底部导航栏 — 与生态页完全一致
                   ============================================================ */
        .bottom-nav {
            flex-shrink: 0;
            background: rgba(5, 11, 21, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 136, 255, 0.15);
            border-radius: 20px;
            box-shadow: 0 -4px 30px rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: space-around;
            padding: 12px 0;
            margin: 0 15px 15px 15px;
            position: relative;
            z-index: 10;
        }
        .bottom-nav::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            right: -1px;
            bottom: -1px;
            border-radius: 20px;
            padding: 1px;
            background: linear-gradient(135deg, var(--gold), transparent, var(--gold));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.4;
        }
        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-secondary);
            font-size: 11px;
            gap: 4px;
            cursor: pointer;
            padding: 5px 10px;
            transition: all 0.3s ease;
            text-decoration: none;
        }
        .nav-item .nav-icon {
            width: 20px;
            height: 20px;
            object-fit: contain;
        }
        .nav-item.active {
            color: var(--gold);
            position: relative;
        }
        .nav-item.active::after {
            content: '';
            position: absolute;
            top: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 20px;
            height: 2px;
            background: linear-gradient(to right, var(--gold), #d4a830);
            border-radius: 5px;
            box-shadow: 0 0 15px var(--gold-glow);
        }
        .nav-item:not(.active):hover {
            color: var(--gold);
        }

        /* ============================================================
                   响应式
                   ============================================================ */
        @media (max-width: 600px) {
            .page-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="scroll-area">

            <!-- ==========================================================
            ★★★ Header — 与生态页完全一致 ★★★
            ========================================================== -->
            <div class="header">
                <div class="logo-area">
                    <img src="https://raw.githubusercontent.com/angnlangnlangnl/AIDC/main/images/aidc.png" alt="AIDC">
                    <span>AIDC</span>
                </div>
                <div class="header-controls">
                    <button class="lang-btn" id="langBtn">🇨🇳 CN ⌄</button>
                    <div class="lang-dropdown" id="langDropdown">
                        <div class="lang-option"><span>🇨🇳 简体中文</span><span class="code">CN</span></div>
                        <div class="lang-option"><span>🇺🇸 English</span><span class="code">EN</span></div>
                        <div class="lang-option"><span>🇭🇰 繁體中文</span><span class="code">ZH</span></div>
                        <div class="lang-option"><span>🇪🇸 Español</span><span class="code">ES</span></div>
                        <div class="lang-option"><span>🇫🇷 Français</span><span class="code">FR</span></div>
                        <div class="lang-option"><span>🇰🇷 한국어</span><span class="code">KO</span></div>
                        <div class="lang-option"><span>🇯🇵 日本語</span><span class="code">JA</span></div>
                        <div class="lang-option"><span>🇸🇦 العربية</span><span class="code">AR</span></div>
                        <div class="lang-option"><span>🇷🇺 Русский</span><span class="code">RU</span></div>
                    </div>
                    <button id="connectWalletBtn" class="connect-btn">Connect wallet</button>
                </div>
            </div>

            <!-- ==========================================================
            ★★★ 页面标题 ★★★
            ========================================================== -->
            <div class="page-title">
                <img src="https://raw.githubusercontent.com/angnlangnlangnl/AIDC/main/images/liquidity.icon.png" alt="流动性">
                <span id="pageTitle">流动性</span>
            </div>

            <!-- ==========================================================
            ★★★ 流动性池面板 (金色断点风格) ★★★
            ========================================================== -->
            <div class="gold-break-panel">
                <div class="corner-deco tl"></div>
                <div class="corner-deco tr"></div>
                <div class="corner-deco bl"></div>
                <div class="corner-deco br"></div>
                <div class="panel-inner">
                    <div style="font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:12px;">💰 流动性池</div>

                    <div class="pool-info">
                        <span class="pool-label">总锁仓量 (TVL)</span>
                        <span class="pool-value">$0.00</span>
                    </div>
                    <div class="pool-info">
                        <span class="pool-label">AIDC 池</span>
                        <span class="pool-value">0.00 <span class="highlight">AIDC</span></span>
                    </div>
                    <div class="pool-info">
                        <span class="pool-label">BNB 池</span>
                        <span class="pool-value">0.00 <span class="highlight">BNB</span></span>
                    </div>
                    <div class="pool-info">
                        <span class="pool-label">交易量 (24h)</span>
                        <span class="pool-value">$0.00</span>
                    </div>

                    <div style="margin-top:15px;padding-top:12px;border-top:1px solid rgba(255,255,255,0.05);">
                        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:8px;">我的流动性</div>
                        <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;">
                            <div class="lp-token-row">
                                <img src="https://raw.githubusercontent.com/angnlangnlangnl/AIDC/main/images/aidc.png" alt="AIDC">
                                <div class="info">
                                    <div class="name">AIDC-BNB LP</div>
                                    <div class="balance">0.0000 LP</div>
                                </div>
                            </div>
                            <div style="display:flex;gap:8px;">
                                <button class="btn-secondary" style="width:auto;padding:6px 16px;font-size:12px;">添加</button>
                                <button class="btn-secondary" style="width:auto;padding:6px 16px;font-size:12px;">移除</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ==========================================================
            ★★★ 添加流动性面板 (金色断点风格) ★★★
            ========================================================== -->
            <div class="gold-break-panel">
                <div class="corner-deco tl"></div>
                <div class="corner-deco tr"></div>
                <div class="corner-deco bl"></div>
                <div class="corner-deco br"></div>
                <div class="panel-inner">
                    <div style="font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:12px;">➕ 添加流动性</div>

                    <div style="background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:12px 15px;margin-bottom:10px;">
                        <div style="display:flex;justify-content:space-between;font-size:12px;color:var(--text-secondary);margin-bottom:6px;">
                            <span>代币 A</span>
                            <span>余额: 0.00</span>
                        </div>
                        <div style="display:flex;justify-content:space-between;align-items:center;">
                            <div style="display:flex;align-items:center;gap:6px;">
                                <img src="https://raw.githubusercontent.com/angnlangnlangnl/AIDC/main/images/aidc.png" style="width:24px;height:24px;border-radius:50%;" alt="AIDC">
                                <span style="font-weight:600;color:var(--text-primary);">AIDC</span>
                            </div>
                            <input type="number" class="input-number" style="font-size:18px;width:60%;text-align:right;background:transparent;border:none;color:var(--text-primary);outline:none;" placeholder="0.0">
                        </div>
                    </div>

                    <div style="text-align:center;margin:-4px 0;position:relative;z-index:2;">
                        <span style="background:rgba(0,16,40,0.8);padding:4px 12px;border-radius:50%;border:1px solid rgba(245,200,66,0.3);display:inline-block;color:var(--gold);font-size:14px;">⇅</span>

    <script>
        // ============================================================
        // 语言切换弹窗逻辑 (与生态页一致)
        // ============================================================
        const langBtn = document.getElementById('langBtn');
        const langDropdown = document.getElementById('langDropdown');

        langBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            langDropdown.classList.toggle('open');
            langBtn.classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
            if (!langDropdown.contains(e.target) && e.target !== langBtn) {
                langDropdown.classList.remove('open');
                langBtn.classList.remove('active');
            }
        });

        document.querySelectorAll('.lang-option').forEach(option => {
            option.addEventListener('click', () => {
                const langCode = option.querySelector('.code').innerText.trim().toLowerCase();
                const langName = option.querySelector('span:first-child').innerText;
                langBtn.textContent = langName + ' ⌄';
                langDropdown.classList.remove('open');
                langBtn.classList.remove('active');
            });
        });

        // ============================================================
        // 钱包连接逻辑 (与生态页一致)
        // ============================================================
        const connectBtn = document.getElementById('connectWalletBtn');

        connectBtn.addEventListener('click', function() {
            if (this.textContent === 'Connect wallet' || this.textContent === '连接钱包') {
                this.textContent = '0x1234...ABCD';
                this.classList.add('connected');
            } else {
                this.textContent = 'Connect wallet';
                this.classList.remove('connected');
            }
        });

        // ============================================================
        // 底部导航激活状态 (与生态页一致)
        // ============================================================
        document.querySelectorAll('.nav-item').forEach(item => {
            item.addEventListener('click', function(e) {
                // 移除所有激活状态
                document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
                // 允许链接跳转
            });
        });
    </script>
