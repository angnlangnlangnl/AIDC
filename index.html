<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>资产 - AIDC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js">
    </script>
    <style>
        /* ============================================================
                   全局重置 & 主题色 — 与AIDC项目统一
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-color: #050B15;
            --card-bg: rgba(8, 20, 48, 0.4);
            --border-color: rgba(0, 136, 255, 0.15);

            --text-primary: #FFFFFF;
            --text-primary-soft: #E2F0FB;
            --text-secondary: #8AA9C9;
            --text-dim: rgba(255, 255, 255, 0.45);

            --cyan-glow: #00DDFF;
            --cyan-dim: #0088FF;

            --gold: #f5c842;
            --gold-glow: rgba(245, 200, 66, 0.6);
            --gold-dim: rgba(245, 200, 66, 0.2);
            --gold-border: rgba(245, 200, 66, 0.3);

            --aidc-blue: #00DDFF;
            --aidc-blue-dim: #0088FF;
            --aidc-blue-glow: rgba(0, 221, 255, 0.5);
            --aidc-blue-border: rgba(0, 221, 255, 0.3);

            /* 内边框蓝色 */
            --inner-blue: #7fc9ff;
            --inner-blue-glow: rgba(127, 201, 255, 0.5);
            --inner-blue-dim: rgba(127, 201, 255, 0.15);
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            color: var(--text-primary);
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 100vh;
            max-height: 100dvh;
            background: radial-gradient(circle at 50% 10%, #102040 0%, #050B15 100%);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 136, 255, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://raw.githubusercontent.com/angnlangnlangnl/AIDC/main/images/bg.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            opacity: 1;
            z-index: 0;
            pointer-events: none;
            border-radius: 20px;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
                   Header — 与生态页一致
                   ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            position: relative;
        }
        .logo-area {
            display: flex;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }
        .logo-area img {
            width: 24px;
            height: 24px;
            margin-right: 5px;
        }
        .logo-area span {
            margin-left: 5px;
            background: linear-gradient(90deg, #0088FF, #00DDFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid rgba(0, 221, 255, 0.3);
            color: #00DDFF;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }
        .lang-btn:hover {
            box-shadow: 0 0 15px rgba(0, 221, 255, 0.4);
            background: rgba(0, 221, 255, 0.1);
        }
        .lang-btn.active {
            background: rgba(0, 221, 255, 0.15);
            border-color: #00DDFF;
            color: #00DDFF;
        }

        .lang-dropdown {
            display: none;
            position: absolute;
            top: 35px;
            right: 0;
            background: rgba(8, 20, 48, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 221, 255, 0.2);
            border-radius: 12px;
            padding: 12px;
            width: 200px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            z-index: 999;
            flex-direction: column;
            gap: 6px;
        }
        .lang-dropdown.open {
            display: flex;
        }
        .lang-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--text-primary-soft);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-option:hover {
            background: rgba(0, 221, 255, 0.1);
            color: #00DDFF;
        }
        .lang-option .code {
            color: #00DDFF;
            font-size: 12px;
            font-weight: 500;
            margin-left: 8px;
        }

        .connect-btn {
            background: transparent;
            border: 1px solid rgba(0, 221, 255, 0.3);
            color: #00DDFF;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 221, 255, 0.05);
            transition: all 0.3s;
            white-space: nowrap;
        }
        .connect-btn:hover:not(:disabled) {
            box-shadow: 0 0 25px rgba(0, 221, 255, 0.25);
            background: rgba(0, 221, 255, 0.08);
        }
        .connect-btn.connected {
            background: rgba(0, 221, 255, 0.12);
            border-color: #00DDFF;
            color: #00DDFF;
            box-shadow: 0 0 20px rgba(0, 221, 255, 0.2);
        }
        .connect-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ============================================================
                   ★★★ 金色断点科技边框风格 ★★★
                   ============================================================ */

        .gold-break-panel {
            position: relative;
            background: rgba(0, 16, 40, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            clip-path: polygon(
                8px 0%,
                calc(100% - 8px) 0%,
                100% 8px,
                100% calc(100% - 8px),
                calc(100% - 8px) 100%,
                8px 100%,
                0% calc(100% - 8px),
                0% 8px
            );
            transition: all 0.3s;
        }
        .gold-break-panel .panel-inner {
            clip-path: polygon(
                8px 0%,
                calc(100% - 8px) 0%,
                100% 8px,
                100% calc(100% - 8px),
                calc(100% - 8px) 100%,
                8px 100%,
                0% calc(100% - 8px),
                0% 8px
            );
            padding: 2px;
        }

        .gold-break-panel::before,
        .gold-break-panel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            clip-path: inherit;
            background: transparent;
            border-radius: 16px;
        }

        /* 外层边框：金色 · 0.75px · 断点 30%-70% */
        .gold-break-panel::before {
            background-image:
                linear-gradient(90deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(180deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(270deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(0deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%);
            background-size:
                100% 0.75px,
                0.75px 100%,
                100% 0.75px,
                0.75px 100%;
            background-position:
                0 0,
                100% 0,
                0 100%,
                0 0;
            background-repeat: no-repeat;
            filter: drop-shadow(0 0 4px rgba(245, 200, 66, 0.3));
            opacity: 0.9;
            animation: goldPulse 4s infinite alternate ease-in-out;
        }

        /* 内层边框：蓝色 · 0.75px · 断点错位 15%-55% */
        .gold-break-panel::after {
            background-image:
                linear-gradient(90deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(180deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(270deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(0deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%);
            background-size:
                100% 0.75px,
                0.75px 100%,
                100% 0.75px,
                0.75px 100%;
            background-position:
                6px 6px,
                calc(100% - 6px) 6px,
                6px calc(100% - 6px),
                6px 6px;
            background-repeat: no-repeat;
            filter: drop-shadow(0 0 6px rgba(0, 180, 255, 0.35));
            opacity: 0.9;
            animation: bluePulse 5s infinite alternate-reverse ease-in-out;
        }

        /* 四角金色装饰 */
        .gold-break-panel .corner-deco {
            position: absolute;
            z-index: 3;
            width: 12px;
            height: 12px;
            background: transparent;
            pointer-events: none;
        }
        .gold-break-panel .corner-deco::before,
        .gold-break-panel .corner-deco::after {
            content: '';
            position: absolute;
            background: #f5c842;
            box-shadow: 0 0 8px rgba(245, 200, 66, 0.4);
            border-radius: 0;
        }
        .gold-break-panel .corner-deco.tl {
            top: 3px;
            left: 3px;
        }
        .gold-break-panel .corner-deco.tl::before {
            top: 0;
            left: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.tl::after {
            top: 0;
            left: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.tr {
            top: 3px;
            right: 3px;
        }
        .gold-break-panel .corner-deco.tr::before {
            top: 0;
            right: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.tr::after {
            top: 0;
            right: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.bl {
            bottom: 3px;
            left: 3px;
        }
        .gold-break-panel .corner-deco.bl::before {
            bottom: 0;
            left: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.bl::after {
            bottom: 0;
            left: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.br {
            bottom: 3px;
            right: 3px;
        }
        .gold-break-panel .corner-deco.br::before {
            bottom: 0;
            right: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.br::after {
            bottom: 0;
            right: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }

        @keyframes goldPulse {
            0% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.4;
            }
        }
        @keyframes bluePulse {
            0% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.9;
            }
            100% {
                opacity: 0.3;
            }
        }

        /* ============================================================
                   金色断点资产卡片
                   ============================================================ */
        .gold-break-asset-card {
            position: relative;
            background: rgba(0, 16, 40, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s;
            clip-path: polygon(
                6px 0%,
                calc(100% - 6px) 0%,
                100% 6px,
                100% calc(100% - 6px),
                calc(100% - 6px) 100%,
                6px 100%,
                0% calc(100% - 6px),
                0% 6px
            );
        }
        .gold-break-asset-card .asset-inner {
            clip-path: polygon(
                6px 0%,
                calc(100% - 6px) 0%,
                100% 6px,
                100% calc(100% - 6px),
                calc(100% - 6px) 100%,
                6px 100%,
                0% calc(100% - 6px),
                0% 6px
            );
            padding: 2px 2px;
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .gold-break-asset-card::before,
        .gold-break-asset-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            clip-path: inherit;
            background: transparent;
            border-radius: 12px;
        }

        .gold-break-asset-card::before {
            background-image:
                linear-gradient(90deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(180deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(270deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(0deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%);
            background-size:
                100% 0.75px,
                0.75px 100%,
                100% 0.75px,
                0.75px 100%;
            background-position:
                0 0,
                100% 0,
                0 100%,
                0 0;
            background-repeat: no-repeat;
            filter: drop-shadow(0 0 4px rgba(245, 200, 66, 0.2));
            opacity: 0.7;
        }

        .gold-break-asset-card::after {
            background-image:
                linear-gradient(90deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(180deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(270deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(0deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%);
            background-size:
                100% 0.75px,
                0.75px 100%,
                100% 0.75px,
                0.75px 100%;
            background-position:
                4px 4px,
                calc(100% - 4px) 4px,
                4px calc(100% - 4px),
                4px 4px;
            background-repeat: no-repeat;
            filter: drop-shadow(0 0 6px rgba(0, 180, 255, 0.2));
            opacity: 0.7;
        }

        .gold-break-asset-card:hover {
            box-shadow: 0 0 30px rgba(245, 200, 66, 0.05);
        }
        .gold-break-asset-card:hover::before {
            filter: drop-shadow(0 0 8px rgba(245, 200, 66, 0.4));
            opacity: 1;
        }

        /* 资产卡片四角装饰 */
        .gold-break-asset-card .corner-deco {
            position: absolute;
            z-index: 3;
            width: 10px;
            height: 10px;
            background: transparent;
            pointer-events: none;
        }
        .gold-break-asset-card .corner-deco::before,
        .gold-break-asset-card .corner-deco::after {
            content: '';
            position: absolute;
            background: #f5c842;
            box-shadow: 0 0 6px rgba(245, 200, 66, 0.3);
            border-radius: 0;
        }
        .gold-break-asset-card .corner-deco.tl {
            top: 2px;
            left: 2px;
        }
        .gold-break-asset-card .corner-deco.tl::before {
            top: 0;

            background: #f5c842;
        }
        .gold-break-asset-card .corner-deco.tl::after {

        }
        .gold-break-asset-card .corner-deco.tr {

        .gold-break-asset-card .corner-deco.tr::before {

        .gold-break-asset-card .corner-deco.tr::after {
            top: 0;

        }
        .gold-break-asset-card .corner-deco.bl {
            bottom: 2px;

        }
        .gold-break-asset-card .corner-deco.bl::before {
            bottom: 0;

        .gold-break-asset-card .corner-deco.bl::after {

        .gold-break-asset-card .corner-deco.br::after {

        }

        /* ============================================================
                   面板内部内容样式
                   ============================================================ */
        .profile-panel {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 4px;
            flex-wrap: wrap;
        }
        .profile-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .avatar-circle {
            width: 50px;
            height: 50px;
            background: linear-gradient(135deg, var(--cyan-dim), var(--cyan-glow));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            font-weight: 900;
            color: #050B15;
            box-shadow: 0 0 20px rgba(0, 204, 255, 0.3);
            flex-shrink: 0;
        }
        .level-badge {
            background: linear-gradient(90deg, var(--cyan-dim), var(--cyan-glow));
            color: #050B15;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: 700;
            white-space: nowrap;
            display: inline-block;
            margin-bottom: 4px;
        }
        .identity-row {
            font-size: 11px;
            color: var(--text-secondary);
            line-height: 1.4;
        }
        .rate-row {
            font-size: 11px;
            color: var(--gold);
            line-height: 1.4;
            font-weight: 500;
        }
        .total-value {
            text-align: right;
        }
        .total-label {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .total-amount {
            font-size: 22px;
            font-weight: 700;
            color: var(--text-primary);
            white-space: nowrap;
            max-width: 100%;
            display: inline-block;
            transition: font-size 0.2s ease;
        }
        .total-amount small {
            font-size: 14px;
            font-weight: 400;
            color: var(--text-secondary);
            white-space: nowrap;
        }
        .total-amount.small-text {
            font-size: 18px;
        }
        .total-amount.xsmall-text {
            font-size: 15px;
        }
        .total-amount.xxsmall-text {
            font-size: 12px;
        }

        .dividend-container {
            width: 100%;
            margin-top: 12px;
            padding-top: 10px;
            border-top: 1px solid rgba(0, 136, 255, 0.1);
        }
        .dividend-title {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            display: block;
        }
        .dividend-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .dividend-item {
            font-size: 10px;
            color: #4caf50;
            line-height: 1.6;
            cursor: pointer;
            padding: 2px 8px;
            border-radius: 12px;
            transition: all 0.2s;
            background: rgba(76, 175, 80, 0.08);
            border: 1px solid rgba(76, 175, 80, 0.15);
        }
        .dividend-item:hover {
            background: rgba(76, 175, 80, 0.15);
        }
        .dividend-empty {
            font-size: 11px;
            color: var(--text-secondary);
        }

        .asset-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 221, 255, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .asset-icon img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }
        .asset-info {
            flex: 1;
            min-width: 0;
        }
        .asset-name {
            font-size: 15px;
            color: var(--text-primary);
            font-weight: 600;
        }
        .asset-price {
            font-size: 12px;
            color: var(--text-secondary);
        }
        .asset-right {
            text-align: right;
            flex-shrink: 0;
        }
        .asset-balance {
            font-size: 15px;

            document.getElementById('navLiquidity').textContent = langData.navLiquidity;
            document.getElementById('navInvite').textContent = langData.navInvite;
            document.getElementById('navEcosystem').textContent = langData.navEcosystem;
            document.getElementById('dividendTitle').textContent = langData.dividendTitle;
        }

        function refreshDisplayText(langData) {
            if (!langData) langData = translations[currentLang] || translations.cn;
            const identityRow = document.getElementById('identityRow');
            const rateRow = document.getElementById('rateRow');
            const identityMatch = identityRow.textContent.match(/[：:]\s*(.*)/);
            const rateMatch = rateRow.textContent.match(/[：:]\s*(.*)/);
            if (identityMatch) identityRow.textContent = langData.identityLabel + '：' + identityMatch[1];
            if (rateMatch) rateRow.textContent = langData.rateLabel + '：' + rateMatch[1];
            const levelEl = document.getElementById('userLevel');
            const levelText = levelEl.textContent;
            const nodeNames = ['普通用户', '首富节点', '星链节点', '创世节点'];
            const index = nodeNames.indexOf(levelText);
            if (index !== -1 && langData.userLevels[index]) levelEl.textContent = langData.userLevels[index];
        }

        function adjustTotalAmountSize() {
            const el = document.getElementById('totalAssetValue');
            const text = el.textContent.replace(/[^0-9.]/g, '');
            const len = text.replace('.', '').length;
            el.classList.remove('small-text', 'xsmall-text', 'xxsmall-text');
            if (len >= 10) el.classList.add('xxsmall-text');
            else if (len >= 8) el.classList.add('xsmall-text');
            else if (len >= 6) el.classList.add('small-text');
        }

        // ============================================================
        // 钱包配置
        // ============================================================
        const AIGC_ADDRESS = '0x2Ad8Ef580B1B6c2Ba5Fc41DF86fC6741D5d102ae';
        const BCBS_ADDRESS = '0x9ECcC2B06582Ca14509CAd41F1d5204979Ce6995';
        const HSBC_ADDRESS = '0x20aD84A60902A91F036bD6bdB85AD1d61B2f65C1';
        const USDT_ADDRESS = '0x55d398326f99059fF775485246999027B3197955';
        const BNB_ORACLE_ADDR = '0x0567F2323251f0Aab15c8dFb1967E4e8A7D42aeE';

        const BNB_ORACLE_ABI = ["function latestRoundData() view returns (uint80 roundId, int256 answer, uint256 startedAt, uint256 updatedAt, uint80 answeredInRound)"];
        const AIGC_ABI = [
            "function getNodeLevel(address) view returns (uint8)",
            "function identityLevel(address) view returns (uint256)",
            "function balanceOf(address) view returns (uint256)",
            "function getPendingDividend(address user, uint8 pool) view returns (uint256)",
            "function claimDividend(uint8 pool) returns (bool)",
            "function isInPool(uint8, address) view returns (bool)"
        ];
        const BCBS_ABI = ["function balanceOf(address) view returns (uint256)", "function userRate(address) view returns (uint256)", "function getBCBSPrice() view returns (uint256)"];
        const ERC20_ABI = ["function balanceOf(address) view returns (uint256)"];

        let currentAccount = null,
            provider = null,
            signer = null;
        let aigcContract, bcbsContract, hsbcContract, usdtContract, bnbOracle;
        let isLoading = false,
            refreshTimer = null;
        const connectBtn = document.getElementById('connectWalletBtn');
        const nodeNames = ['普通用户', '首富节点', '星链节点', '创世节点'];
        const poolNames = ['首富池', '星链池', '创世池', 'S4池', 'S5池', 'S6池', 'S7池', 'S8池'];

        function initContracts() {
            if (provider && signer) {
                aigcContract = new ethers.Contract(AIGC_ADDRESS, AIGC_ABI, signer);
                bcbsContract = new ethers.Contract(BCBS_ADDRESS, BCBS_ABI, signer);
                hsbcContract = new ethers.Contract(HSBC_ADDRESS, ERC20_ABI, signer);
                usdtContract = new ethers.Contract(USDT_ADDRESS, ERC20_ABI, signer);
                bnbOracle = new ethers.Contract(BNB_ORACLE_ADDR, BNB_ORACLE_ABI, provider);
            }
        }

        async function getBNBPrice() {
            try {
                const [, a] = await bnbOracle.latestRoundData();
                return parseFloat(ethers.utils.formatUnits(a, 8));
            } catch (e) { return 580; }
        }

        async function getBCBSPrice() {
            try {
                const r = await bcbsContract.getBCBSPrice();
                const p = parseFloat(ethers.utils.formatEther(r));
                if (p > 0) return p;
            } catch (e) {}
            return 0;
        }

        window.handleConnect = async function() {
            if (isLoading) return;
            if (currentAccount) { disconnectWallet(); return; }
            await connectWallet();
        };

        async function connectWallet() {
            if (!window.ethereum) { alert('请安装 MetaMask'); return; }
            isLoading = true;
            connectBtn.disabled = true;
            connectBtn.innerHTML = '连接中<span class="loading-spinner"></span>';
            try {
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                currentAccount = accounts[0];
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                initContracts();
                connectBtn.textContent = currentAccount.substring(0, 6) + '...' + currentAccount.substring(currentAccount.length - 4);
                connectBtn.classList.add('connected');
                connectBtn.disabled = false;
                await loadAllData();
                if (refreshTimer) clearInterval(refreshTimer);
                refreshTimer = setInterval(async () => { if (currentAccount) await loadAllData(); }, 30000);
            } catch (e) {
                if (e.code === 4001) alert('请在 MetaMask 中授权连接');
                else alert('连接失败: ' + (e.message || '未知错误'));
                connectBtn.disabled = false;
                connectBtn.innerHTML = 'Connect wallet';
            } finally {
                isLoading = false;
            }
        }

        function disconnectWallet() {
            currentAccount = null;
            provider = null;
            signer = null;
            aigcContract = null;
            bcbsContract = null;
            hsbcContract = null;
            usdtContract = null;
            bnbOracle = null;
            if (refreshTimer) { clearInterval(refreshTimer);
                refreshTimer = null; }
            connectBtn.textContent = 'Connect wallet';
            connectBtn.classList.remove('connected');
            connectBtn.disabled = false;
            resetUI();
        }

        async function loadAllData() {
            if (!currentAccount || !aigcContract || !bcbsContract) return;

            const [bnbPrice, bcbsPrice] = await Promise.all([getBNBPrice(), getBCBSPrice()]);
            document.getElementById('price-BNB').textContent = '$' + bnbPrice.toFixed(2);
            document.getElementById('price-BCBS').textContent = '$' + bcbsPrice.toFixed(4);

            let nodeLevel = 0,
                identityLevel = 0,
                userRate = 0;
            try {
                const lvl = await aigcContract.getNodeLevel(currentAccount);
                nodeLevel = parseInt(lvl.toString());
            } catch (e) {}
            if (nodeLevel === 0) {
                try { if (await aigcContract.isInPool(2, currentAccount)) nodeLevel = 3; } catch (e) {}
            }
            if (nodeLevel === 0) {
                try { if (await aigcContract.isInPool(1, currentAccount)) nodeLevel = 2; } catch (e) {}
            }
            if (nodeLevel === 0) {
                try { if (await aigcContract.isInPool(0, currentAccount)) nodeLevel = 1; } catch (e) {}
            }
            try {
                const id = await aigcContract.identityLevel(currentAccount);
                identityLevel = parseInt(id.toString());
            } catch (e) {}
            try {
                const rate = await bcbsContract.userRate(currentAccount);
                userRate = parseFloat(ethers.utils.formatEther(rate));
            } catch (e) {}
            if (userRate === 0) {
                const baseRates = [0, 0.02, 0.04, 0.15];
                userRate = baseRates[nodeLevel] || 0;
            }

            const langData = translations[currentLang] || translations.cn;
            const levelName = langData.userLevels[nodeLevel] || '普通用户';
            document.getElementById('userLevel').textContent = levelName;
            document.getElementById('identityRow').textContent = langData.identityLabel + '：S' + identityLevel;
            document.getElementById('rateRow').textContent = langData.rateLabel + '：' + (userRate * 100).toFixed(1) + '%';

            let dividendHtml = '',
                hasDividend = false;
            const poolNames = langData.poolNames;
            for (let i = 0; i < 8; i++) {
                try {
                    const inPool = await aigcContract.isInPool(i, currentAccount);
                    if (inPool) {
                        hasDividend = true;
                        const pend = await aigcContract.getPendingDividend(currentAccount, i);
                        const val = parseFloat(ethers.utils.formatEther(pend));
                        dividendHtml += `<span class="dividend-item" onclick="claimPoolDividend(${i})" title="点击领取">${poolNames[i]} ${val.toFixed(4)}</span>`;
                    }
                } catch (e) {}
            }
            if (!hasDividend) dividendHtml = '<span class="dividend-empty">' + langData.dividendEmpty + '</span>';
            document.getElementById('dividendList').innerHTML = dividendHtml;

            let bnb = 0,
                usdt = 0,
                aidc = 0,
                bcbs = 0,
                hsbc = 0;
            try { bnb = parseFloat(ethers.utils.formatEther(await provider.getBalance(currentAccount))); } catch (e) {}
            try { usdt = parseFloat(ethers.utils.formatEther(await usdtContract.balanceOf(currentAccount))); } catch (e) {}
            try { aidc = parseFloat(ethers.utils.formatEther(await aigcContract.balanceOf(currentAccount))); } catch (e) {}
            try { bcbs = parseFloat(ethers.utils.formatEther(await bcbsContract.balanceOf(currentAccount))); } catch (e) {}
            try { hsbc = parseFloat(ethers.utils.formatEther(await hsbcContract.balanceOf(currentAccount))); } catch (e) {}

            const tokens = [
                { sym: 'BNB', balance: bnb, price: bnbPrice },
                { sym: 'USDT', balance: usdt, price: 1 },
                { sym: 'AIDC', balance: aidc, price: 1 },
                { sym: 'BCBS', balance: bcbs, price: bcbsPrice },
                { sym: 'HSBC', balance: hsbc, price: 0 }
            ];
            let total = 0;
            for (const t of tokens) {
                const usdVal = t.balance * t.price;
                total += usdVal;
                document.getElementById('bal-' + t.sym).textContent = t.balance.toFixed(4);
                document.getElementById('usd-' + t.sym).textContent = '≈ $' + usdVal.toFixed(2);
            }
            document.getElementById('totalAssetValue').innerHTML = '$' + total.toFixed(2) + ' <small>USD</small>';
            adjustTotalAmountSize();
        }

        window.claimPoolDividend = async function(poolId) {
            if (!currentAccount || !aigcContract) { alert('请先连接钱包'); return; }
            try {
                const tx = await aigcContract.claimDividend(poolId);
                await tx.wait();
                alert('✅ 领取成功！');
                await loadAllData();
            } catch (e) {
                alert('领取失败: ' + (e.reason || e.message));
            }
        };

        function resetUI() {
            document.getElementById('totalAssetValue').innerHTML = '0.00 <small>USD</small>';
            const langData = translations[currentLang] || translations.cn;
            document.getElementById('userLevel').textContent = langData.userLevels[0] || '普通用户';
            document.getElementById('identityRow').textContent = langData.identityLabel + '：S0';
            document.getElementById('rateRow').textContent = langData.rateLabel + '：0.00%';
            document.getElementById('dividendList').innerHTML = langData.dividendEmpty;
            document.getElementById('price-BNB').textContent = '$580.25';
            document.getElementById('price-BCBS').textContent = '$0.00';
            ['BNB', 'USDT', 'AIDC', 'BCBS', 'HSBC'].forEach(s => {
                document.getElementById('bal-' + s).textContent = '0.0000';
                document.getElementById('usd-' + s).textContent = '≈ $0.00';
            });
            document.getElementById('totalAssetValue').classList.remove('small-text', 'xsmall-text', 'xxsmall-text');
        }

        async function autoConnect() {
            if (!window.ethereum) return;
            try {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts && accounts.length > 0) {
                    currentAccount = accounts[0];
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    initContracts();
                    connectBtn.textContent = currentAccount.substring(0, 6) + '...' + currentAccount.substring(currentAccount.length - 4);
                    connectBtn.classList.add('connected');
                    connectBtn.disabled = false;
                    await loadAllData();
                    if (refreshTimer) clearInterval(refreshTimer);
                    refreshTimer = setInterval(async () => { if (currentAccount) await loadAllData(); }, 30000);
                }
            } catch (e) {}
            window.ethereum.on('accountsChanged', (accounts) => {
                if (!accounts || accounts.length === 0) disconnectWallet();
                else {
                    currentAccount = accounts[0];
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    initContracts();
                    connectBtn.textContent = currentAccount.substring(0, 6) + '...' + currentAccount.substring(currentAccount.length - 4);
                    connectBtn.classList.add('connected');
                    connectBtn.disabled = false;
                    loadAllData();
                }
            });
            window.ethereum.on('chainChanged', () => {
                if (currentAccount) {
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    initContracts();
                    loadAllData();
                }
            });
            window.ethereum.on('disconnect', () => disconnectWallet());
        }

        window.addEventListener('load', () => setTimeout(() => autoConnect(), 500));
        document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && currentAccount) loadAllData(); });
        window.addEventListener('beforeunload', () => { if (refreshTimer) clearInterval(refreshTimer); });
    </script>
</body>
</html>
