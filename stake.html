<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>质押 - AIDC</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/5.7.2/ethers.umd.min.js">
    </script>
    <style>
        /* ============================================================
                   全局重置 & 主题色 — 与AIDC项目统一
                   ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        :root {
            --bg-color: #050B15;
            --card-bg: rgba(8, 20, 48, 0.4);
            --border-color: rgba(0, 136, 255, 0.15);

            --text-primary: #FFFFFF;
            --text-primary-soft: #E2F0FB;
            --text-secondary: #8AA9C9;
            --text-dim: rgba(255, 255, 255, 0.45);

            --cyan-glow: #00DDFF;
            --cyan-dim: #0088FF;

            --gold: #f5c842;
            --gold-glow: rgba(245, 200, 66, 0.6);
            --gold-dim: rgba(245, 200, 66, 0.2);
            --gold-border: rgba(245, 200, 66, 0.3);

            --aidc-blue: #00DDFF;
            --aidc-blue-dim: #0088FF;
            --aidc-blue-glow: rgba(0, 221, 255, 0.5);
            --aidc-blue-border: rgba(0, 221, 255, 0.3);

            /* 内边框蓝色 */
            --inner-blue: #7fc9ff;
            --inner-blue-glow: rgba(127, 201, 255, 0.5);
            --inner-blue-dim: rgba(127, 201, 255, 0.15);
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            color: var(--text-primary);
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            height: 100%;
            max-height: 100vh;
            max-height: 100dvh;
            background: radial-gradient(circle at 50% 10%, #102040 0%, #050B15 100%);
            border-radius: 20px;
            box-shadow: 0 0 40px rgba(0, 136, 255, 0.1);
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .app-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image: url('https://raw.githubusercontent.com/angnlangnlangnl/AIDC/main/images/bg.png');
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            opacity: 1;
            z-index: 0;
            pointer-events: none;
            border-radius: 20px;
        }

        .scroll-area {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
            position: relative;
            z-index: 1;
        }

        /* ============================================================
                   Header — 与生态页一致
                   ============================================================ */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            position: relative;
        }
        .logo-area {
            display: flex;
            align-items: center;
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 0.5px;
        }
        .logo-area img {
            width: 24px;
            height: 24px;
            margin-right: 5px;
        }
        .logo-area span {
            margin-left: 5px;
            background: linear-gradient(90deg, #0088FF, #00DDFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
        }

        .lang-btn {
            background: transparent;
            border: 1px solid rgba(0, 221, 255, 0.3);
            color: #00DDFF;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            position: relative;
            transition: all 0.3s;
        }
        .lang-btn:hover {
            box-shadow: 0 0 15px rgba(0, 221, 255, 0.4);
            background: rgba(0, 221, 255, 0.1);
        }
        .lang-btn.active {
            background: rgba(0, 221, 255, 0.15);
            border-color: #00DDFF;
            color: #00DDFF;
        }

        .lang-dropdown {
            display: none;
            position: absolute;
            top: 35px;
            right: 0;
            background: rgba(8, 20, 48, 0.95);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 221, 255, 0.2);
            border-radius: 12px;
            padding: 12px;
            width: 200px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8);
            z-index: 999;
            flex-direction: column;
            gap: 6px;
        }
        .lang-dropdown.open {
            display: flex;
        }
        .lang-option {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 6px;
            color: var(--text-primary-soft);
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .lang-option:hover {
            background: rgba(0, 221, 255, 0.1);
            color: #00DDFF;
        }
        .lang-option .code {
            color: #00DDFF;
            font-size: 12px;
            font-weight: 500;
            margin-left: 8px;
        }

        .connect-btn {
            background: transparent;
            border: 1px solid rgba(0, 221, 255, 0.3);
            color: #00DDFF;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(0, 221, 255, 0.05);
            transition: all 0.3s;
            white-space: nowrap;
        }
        .connect-btn:hover:not(:disabled) {
            box-shadow: 0 0 25px rgba(0, 221, 255, 0.25);
            background: rgba(0, 221, 255, 0.08);
        }
        .connect-btn.connected {
            background: rgba(0, 221, 255, 0.12);
            border-color: #00DDFF;
            color: #00DDFF;
            box-shadow: 0 0 20px rgba(0, 221, 255, 0.2);
        }
        .connect-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ============================================================
                   ★★★ 金色断点科技边框风格 ★★★
                   ============================================================ */

        .gold-break-panel {
            position: relative;
            background: rgba(0, 16, 40, 0.3);
            backdrop-filter: blur(8px);
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 15px;
            clip-path: polygon(
                8px 0%,
                calc(100% - 8px) 0%,
                100% 8px,
                100% calc(100% - 8px),
                calc(100% - 8px) 100%,
                8px 100%,
                0% calc(100% - 8px),
                0% 8px
            );
            transition: all 0.3s;
        }
        .gold-break-panel .panel-inner {
            clip-path: polygon(
                8px 0%,
                calc(100% - 8px) 0%,
                100% 8px,
                100% calc(100% - 8px),
                calc(100% - 8px) 100%,
                8px 100%,
                0% calc(100% - 8px),
                0% 8px
            );
            padding: 2px;
        }

        .gold-break-panel::before,
        .gold-break-panel::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            clip-path: inherit;
            background: transparent;
            border-radius: 16px;
        }

        /* 外层边框：金色 · 0.75px · 断点 30%-70% */
        .gold-break-panel::before {
            background-image:
                linear-gradient(90deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(180deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(270deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(0deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%);
            background-size:
                100% 0.75px,
                0.75px 100%,
                100% 0.75px,
                0.75px 100%;
            background-position:
                0 0,
                100% 0,
                0 100%,
                0 0;
            background-repeat: no-repeat;
            filter: drop-shadow(0 0 4px rgba(245, 200, 66, 0.3));
            opacity: 0.9;
            animation: goldPulse 4s infinite alternate ease-in-out;
        }

        /* 内层边框：蓝色 · 0.75px · 断点错位 15%-55% */
        .gold-break-panel::after {
            background-image:
                linear-gradient(90deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(180deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(270deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(0deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%);
            background-size:
                100% 0.75px,
                0.75px 100%,
                100% 0.75px,
                0.75px 100%;
            background-position:
                6px 6px,
                calc(100% - 6px) 6px,
                6px calc(100% - 6px),
                6px 6px;
            background-repeat: no-repeat;
            filter: drop-shadow(0 0 6px rgba(0, 180, 255, 0.35));
            opacity: 0.9;
            animation: bluePulse 5s infinite alternate-reverse ease-in-out;
        }

        /* 四角金色装饰 */
        .gold-break-panel .corner-deco {
            position: absolute;
            z-index: 3;
            width: 12px;
            height: 12px;
            background: transparent;
            pointer-events: none;
        }
        .gold-break-panel .corner-deco::before,
        .gold-break-panel .corner-deco::after {
            content: '';
            position: absolute;
            background: #f5c842;
            box-shadow: 0 0 8px rgba(245, 200, 66, 0.4);
            border-radius: 0;
        }
        .gold-break-panel .corner-deco.tl {
            top: 3px;
            left: 3px;
        }
        .gold-break-panel .corner-deco.tl::before {
            top: 0;
            left: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.tl::after {
            top: 0;
            left: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.tr {
            top: 3px;
            right: 3px;
        }
        .gold-break-panel .corner-deco.tr::before {
            top: 0;
            right: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.tr::after {
            top: 0;
            right: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.bl {
            bottom: 3px;
            left: 3px;
        }
        .gold-break-panel .corner-deco.bl::before {
            bottom: 0;
            left: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.bl::after {
            bottom: 0;
            left: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.br {
            bottom: 3px;
            right: 3px;
        }
        .gold-break-panel .corner-deco.br::before {
            bottom: 0;
            right: 0;
            width: 10px;
            height: 1.5px;
            background: #f5c842;
        }
        .gold-break-panel .corner-deco.br::after {
            bottom: 0;
            right: 0;
            width: 1.5px;
            height: 10px;
            background: #f5c842;
        }

        @keyframes goldPulse {
            0% {
                opacity: 0.4;
            }
            50% {
                opacity: 1;
            }
            100% {
                opacity: 0.4;
            }
        }
        @keyframes bluePulse {
            0% {
                opacity: 0.3;
            }
            50% {
                opacity: 0.9;
            }
            100% {
                opacity: 0.3;
            }
        }

        /* ============================================================
                   质押卡片边框 (金色断点风格)
                   ============================================================ */
        .gold-break-stake-card {
            position: relative;
            background: rgba(0, 16, 40, 0.3);
            backdrop-filter: blur(8px);
            border: none;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 14px;
            clip-path: polygon(
                8px 0%,
                calc(100% - 8px) 0%,
                100% 8px,
                100% calc(100% - 8px),
                calc(100% - 8px) 100%,
                8px 100%,
                0% calc(100% - 8px),
                0% 8px
            );
            transition: all 0.3s;
        }
        .gold-break-stake-card:hover {
            box-shadow: 0 0 30px rgba(245, 200, 66, 0.05);
        }
        .gold-break-stake-card:hover::before {
            filter: drop-shadow(0 0 8px rgba(245, 200, 66, 0.4));
            opacity: 1;
        }

        .gold-break-stake-card::before,
        .gold-break-stake-card::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
            clip-path: inherit;
            background: transparent;
            border-radius: 16px;
        }

        .gold-break-stake-card::before {
            background-image:
                linear-gradient(90deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(180deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(270deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%),
                linear-gradient(0deg, #f5c842 0%, #f5c842 30%, transparent 30%, transparent 70%, #f5c842 70%, #f5c842 100%);
            background-size:
                100% 0.75px,
                0.75px 100%,
                100% 0.75px,
                0.75px 100%;
            background-position:
                0 0,
                100% 0,
                0 100%,
                0 0;
            background-repeat: no-repeat;
            filter: drop-shadow(0 0 4px rgba(245, 200, 66, 0.2));
            opacity: 0.7;
        }

        .gold-break-stake-card::after {
            background-image:
                linear-gradient(90deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(180deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(270deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%),
                linear-gradient(0deg, #7fc9ff 0%, #7fc9ff 15%, transparent 15%, transparent 55%, #7fc9ff 55%, #7fc9ff 100%);
            background-size:
                100% 0.75px,
                0.75px 100%,
                100% 0.75px,
                0.75px 100%;
            background-position:
                4px 4px,
                calc(100% - 4px) 4px,
                4px calc(100% - 4px),
                4px 4px;
            background-repeat: no-repeat;
            filter: drop-shadow(0 0 6px rgba(0, 180, 255, 0.2));
            opacity: 0.7;
        }

        /* 四角装饰 */
        .gold-break-stake-card .corner-deco {
            position: absolute;
            z-index: 3;
            width: 10px;
            height: 10px;
            background: transparent;
            pointer-events: none;
        }
        .gold-break-stake-card .corner-deco::before,
        .gold-break-stake-card .corner-deco::after {
            content: '';
            position: absolute;
            background: #f5c842;
            box-shadow: 0 0 6px rgba(245, 200, 66, 0.3);
            border-radius: 0;
        }
        .gold-break-stake-card .corner-deco.tl {
            top: 2px;
            left: 2px;
        }
        .gold-break-stake-card .corner-deco.tl::before {
            top: 0;

            background: #f5c842;
        }
        .gold-break-stake-card .corner-deco.tl::after {
            top: 0;

        .gold-break-stake-card .corner-deco.tr {

        }
        .gold-break-stake-card .corner-deco.bl {

        .gold-break-stake-card .corner-deco.bl::before {

            background: #f5c842;
        }

        /* ★★★ 按钮样式 — 内边框蓝色系 ★★★ */
        .btn-clip {
            clip-path: polygon(4px 0%, calc(100% - 4px) 0%, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0% calc(100% - 4px), 0% 4px);
            letter-spacing: 2px;
            transition: all 0.3s;
        }
        .btn-clip:hover:not(:disabled) {
            transform: translateY(-2px);
        }
        .btn-clip:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-stake-blue {
            display: inline-block;
            padding: 14px 24px;
            border: 1px solid #7fc9ff;
            border-radius: 0;
            font-size: 0.95rem;
            letter-spacing: 3px;
            color: #7fc9ff;
            background: rgba(127, 201, 255, 0.08);
            clip-path: polygon(6px 0%, calc(100% - 6px) 0%, 100% 6px, 100% calc(100% - 6px), calc(100% - 6px) 100%, 6px 100%, 0% calc(100% - 6px), 0% 6px);
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
            text-align: center;
            font-weight: 600;
            box-shadow: 0 0 20px rgba(127, 201, 255, 0.05);
        }
        .btn-stake-blue:hover:not(:disabled) {
            background: rgba(127, 201, 255, 0.18);
            box-shadow: 0 0 30px rgba(127, 201, 255, 0.25);
            transform: translateY(-2px);
        }
        .btn-stake-blue:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
        }
        .btn-stake-blue:active:not(:disabled) {
            transform: translateY(0px);
        }

        .btn-primary-blue {
            background: rgba(127, 201, 255, 0.08);
            color: #7fc9ff;
            border: 1px solid #7fc9ff;
        }
        .btn-primary-blue:hover:not(:disabled) {
            background: rgba(127, 201, 255, 0.18);
            box-shadow: 0 0 15px rgba(127, 201, 255, 0.2);
        }

        .btn-success-blue {
            background: rgba(127, 201, 255, 0.08);
            color: #7fc9ff;
            border: 1px solid #7fc9ff;
        }
        .btn-success-blue:hover:not(:disabled) {
            background: rgba(127, 201, 255, 0.18);
        }

        .btn-danger-blue {
            background: rgba(127, 201, 255, 0.08);

        }
        .btn-danger-blue:hover:not(:disabled) {
            background: rgba(127, 201, 255, 0.18);

        .btn-retry-blue {
            background: rgba(127, 201, 255, 0.08);

        }
        .btn-retry-blue:hover {
            background: rgba(127, 201, 255, 0.18);
        }

        /* ============================================================
                   内容样式
                   ============================================================ */

        /* ★★★ 移除页面标题 ★★★ */
        .page-title {
            display: none;
        }

        /* 余额面板 */
        .balance-panel {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0;
            padding: 12px;
            position: relative;
        }
        .balance-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px 10px;
            position: relative;
        }
        .balance-item:first-child {
            border-right: 1px solid rgba(0, 136, 255, 0.2);
        }
        .balance-label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 2px;
            font-weight: 400;
        }
        .balance-value {
            font-size: 16px;
            font-weight: 600;
            color: var(--cyan-glow);
            text-align: center;
            word-break: break-all;
        }

        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            background: rgba(0, 20, 40, 0.5);
            border: 1px solid rgba(0, 136, 255, 0.2);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            clip-path: polygon(4px 0%, calc(100% - 4px) 0%, 100% 4px, 100% calc(100% - 4px), calc(100% - 4px) 100%, 4px 100%, 0% calc(100% - 4px), 0% 4px);

        function showLoading() { loadingOverlay.style.display = 'flex'; }
        function hideLoading() { loadingOverlay.style.display = 'none'; }

        function formatTokenAmount(amount, decimals = 18, precision = 5) {
            if (!amount || amount === '0' || amount === 0) return '0.' + '0'.repeat(precision);
            try {
                if (typeof amount === 'object' && amount._isBigNumber) {
                    return parseFloat(ethers.utils.formatUnits(amount, decimals)).toFixed(precision);
                }
                return parseFloat(amount).toFixed(precision);
            } catch (e) { return '0.' + '0'.repeat(precision); }
        }

        function formatTimestamp(timestamp) {
            if (!timestamp || timestamp === '0' || timestamp === 0) return '--';
            try {
                const ts = typeof timestamp === 'object' ? timestamp.toNumber() : parseInt(timestamp);
                return new Date(ts * 1000).toLocaleString('zh-CN', { year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
            } catch (e) { return '--'; }
        }

        function formatRemainingTime(endTime) {
            const now = Math.floor(Date.now() / 1000);
            const remaining = endTime - now;
            if (remaining <= 0) return '已到期 ✅';
            const days = Math.floor(remaining / 86400);
            const hours = Math.floor((remaining % 86400) / 3600);
            const minutes = Math.floor((remaining % 3600) / 60);
            if (days > 0) return `${days}天${hours}小时${minutes}分钟`;
            if (hours > 0) return `${hours}小时${minutes}分钟`;
            return `${minutes}分钟`;
        }

        function getPeriodName(period) {
            const map = { 0: { name: '7 天', test: '35 分钟' }, 1: { name: '35 天', test: '175 分钟' }, 2: { name: '180 天', test: '15 小时' }, 3: { name: '360 天', test: '30 小时' }, 4: { name: '540 天', test: '45 小时' }, 5: { name: '720 天', test: '60 小时' } };
            return map[period] || { name: '未知', test: '--' };
        }

        function getDailyRate(period) {
            const map = { 0: '0.8%', 1: '1.3%', 2: '1.8%', 3: '2.1%', 4: '2.3%', 5: '2.6%' };
            return map[period] || '--';
        }

        function getStatusLabel(redeemed, endTime) {
            const langData = translations[currentLang] || translations.cn;
            if (redeemed) return { text: langData.statusRedeemed, cls: 'status-redeemed' };
            const now = Math.floor(Date.now() / 1000);
            if (now >= endTime) return { text: langData.statusReady, cls: 'status-ready' };
            return { text: langData.statusActive, cls: 'status-active' };
        }

        function initContracts() {
            if (provider && signer) {
                aigcContract = new ethers.Contract(AIGC_ADDRESS, ERC20_ABI, signer);
                usdtContract = new ethers.Contract(USDT_ADDRESS, ERC20_ABI, signer);
                stakeContract = new ethers.Contract(BCBS_ADDRESS, STAKE_ABI, signer);
            }
        }

        async function fetchChainParams() {
            if (!stakeContract) return;
            try {
                const ds = await stakeContract.daySeconds();
                if (ds && ds.gt(0)) cachedDaySeconds = ds.toNumber();
            } catch (e) {
                cachedDaySeconds = 86400;
            }
        }

        async function getDecimals(contract) {
            try { return await contract.decimals(); } catch (e) { return 18; }
        }

        async function updateBalance() {
            try {
                const contract = currentCoin === 'AIGC' ? aigcContract : usdtContract;
                if (!contract || !currentAccount) { document.getElementById('availableBalance').textContent = '0.00000'; return; }
                const balance = await contract.balanceOf(currentAccount);
                const decimals = await getDecimals(contract);
                document.getElementById('availableBalance').textContent = parseFloat(ethers.utils.formatUnits(balance, decimals)).toFixed(5);
            } catch (e) { document.getElementById('availableBalance').textContent = '0.00000'; }
        }

        async function updateAllBalances() {
            if (!currentAccount || !aigcContract || !usdtContract) return;
            try {
                const [aigcBal, usdtBal, aigcDec, usdtDec] = await Promise.all([
                    aigcContract.balanceOf(currentAccount), usdtContract.balanceOf(currentAccount),
                    getDecimals(aigcContract), getDecimals(usdtContract)
                ]);
                document.getElementById('aigcBalance').textContent = parseFloat(ethers.utils.formatUnits(aigcBal, aigcDec)).toFixed(5);
                document.getElementById('usdtBalance').textContent = parseFloat(ethers.utils.formatUnits(usdtBal, usdtDec)).toFixed(5);
            } catch (e) {}
        }

        function updateRewardPreview() {
            const amount = parseFloat(document.getElementById('stakeAmount').value) || 0;
            const reward = amount * dailyRates[currentPeriod] * periodDays[currentPeriod];
            document.getElementById('estimatedReward').textContent = `${reward.toFixed(5)} BCBS`;
        }

        async function refreshAll() {
            if (!currentAccount) return;
            await Promise.all([updateBalance(), updateAllBalances(), loadOrders()]);
            updateRewardPreview();
        }

        // ============================================================
        // 加载质押订单
        // ============================================================
        async function loadOrders() {
            const container = document.getElementById('orderListContainer');
            const langData = translations[currentLang] || translations.cn;

            if (!currentAccount || !stakeContract) { container.innerHTML = renderSkeleton(); return; }
            container.innerHTML = renderSkeleton();

            try {
                const ids = await stakeContract.getUserStakeIds(currentAccount);
                if (!ids || ids.length === 0) { container.innerHTML = renderEmptyCard(langData); return; }

                let html = '',
                    successCount = 0,
                    failedCount = 0;
                for (const id of ids) {
                    try {
                        const orderHtml = await loadSingleOrder(id, langData);
                        html += orderHtml;
                        successCount++;
                    } catch (orderErr) {
                        failedCount++;
                        html += renderErrorCard(id, orderErr, langData);
                    }
                }

                if (failedCount > 0) {
                    html += `<div style="color:var(--cyan-glow);text-align:center;padding:10px;font-size:12px;background:rgba(0,204,255,0.05);border-radius:8px;margin-top:8px;clip-path:polygon(4px 0%,calc(100% - 4px) 0%,100% 4px,100% calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,0% calc(100% - 4px),0% 4px);">✅ ${successCount} 个订单正常 &nbsp;|&nbsp; ❌ ${failedCount} 个订单加载失败</div>`;
                }
                container.innerHTML = html;
                startCountdown();
                bindOrderActions();
            } catch (e) {
                container.innerHTML = renderGlobalErrorCard(e, langData);
            }
        }

        async function loadSingleOrder(id, langData) {
            try {
                const result = await stakeContract.getStakeInfo(id);
                const stakeId = (result.id || result[0]).toString();
                const tokenType = result.tokenType !== undefined ? result.tokenType : result[2];
                const amount = result.amount || result[3];
                const startTime = (result.startTime || result[4]).toString();
                const period = result.period !== undefined ? result.period : result[5];
                const redeemed = result.redeemed !== undefined ? result.redeemed : result[6];
                const accumulatedClaimed = result.accumulatedClaimed || result[8];

                let pendingDisplay = '0.00000 BCBS',
                    pendingValue = 0;
                try {
                    const pending = await stakeContract.getPendingInterest(id);
                    pendingValue = pending ? parseFloat(ethers.utils.formatUnits(pending, 18)) : 0;
                    pendingDisplay = pendingValue.toFixed(5) + ' BCBS';
                } catch (pendingErr) {
                    pendingDisplay = '⚠️ 暂不可用';
                }

                const tokenName = tokenType === 0 ? 'AIGC' : 'USDT';
                let decimals = 18;
                try { const contract = tokenType === 0 ? aigcContract : usdtContract;
                    decimals = await getDecimals(contract); } catch (e) {}

                const periodInfo = getPeriodName(Number(period));
                const dailyRate = getDailyRate(Number(period));
                const endTime = parseInt(startTime) + periodDays[Number(period)] * cachedDaySeconds;
                const status = getStatusLabel(redeemed, endTime);

                return `
                        <div class="gold-break-stake-card" data-stake-id="${stakeId}">
                            <div class="corner-deco tl"></div>
                            <div class="corner-deco tr"></div>
                            <div class="corner-deco bl"></div>
                            <div class="corner-deco br"></div>

                            <div class="info-row"><span class="label">${langData.labelAsset}</span><span class="value">${tokenName}</span></div>
                            <div class="info-row"><span class="label">${langData.labelAmount}</span><span class="value">${formatTokenAmount(amount, decimals)} ${tokenName}</span></div>
                            <div class="info-row"><span class="label">${langData.labelStart}</span><span class="value">${formatTimestamp(startTime)}</span></div>
                            <div class="info-row"><span class="label">${langData.labelEnd}</span><span class="value">${formatTimestamp(endTime)}</span></div>
                            <div class="info-row"><span class="label">${langData.labelRemaining}</span><span class="value countdown" data-end-time="${endTime}">${formatRemainingTime(endTime)}</span></div>
                            <div class="info-row"><span class="label">${langData.labelPeriod}</span><span class="value">${periodInfo.name}${cachedDaySeconds !== 86400 ? ' (测试版)' : ''}</span></div>
                            <div class="info-row"><span class="label">${langData.labelDailyRate}</span><span class="value rate">${dailyRate}</span></div>
                            <div class="stake-interest">
                                <div class="info-row"><span class="label">${langData.labelClaimed}</span><span class="value">${formatTokenAmount(accumulatedClaimed)} BCBS</span></div>
                                <div class="info-row"><span class="label">${langData.labelPending}</span><span class="value pending-interest">${pendingDisplay}</span></div>

                                ${status.text === langData.statusReady ? `<button class="btn btn-success-blue btn-clip" data-id="${stakeId}" data-action="redeem">${langData.btnRedeem}</button>` : `<button class="btn btn-danger-blue btn-clip" data-id="${stakeId}" data-action="early" ${redeemed ? 'disabled' : ''}>${langData.btnEarly}</button>`}
                            </div>
                        </div>`;
            } catch (e) { throw e; }
        }

            if (countdownTimer) clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                document.querySelectorAll('.countdown').forEach(el => {

        }

        function bindOrderActions() {
            const langData = translations[currentLang] || translations.cn;

            document.querySelectorAll('.stake-actions .btn:not(:disabled)').forEach(btn => {
                const newBtn = btn.cloneNode(true);
                btn.parentNode.replaceChild(newBtn, btn);
                newBtn.addEventListener('click', async function() {
                    const id = this.dataset.id,
                        action = this.dataset.action;
                    this.disabled = true;
                    const origText = this.textContent;
                    this.textContent = langData.processing;
                    try {
                        if (action === 'claim') {
                            const pending = await stakeContract.getPendingInterest(id);
                            if (!pending || pending.eq(0)) { alert(langData.noInterest); return; }
                            let fee;
                            try { fee = await stakeContract.getBnbRequiredForClaim(pending); } catch (e) { fee = ethers.utils.parseEther('0.01'); }
                            const tx = await stakeContract.claimInterest(id, { value: fee, gasLimit: 500000 });
                            await tx.wait();
                            alert(langData.successClaim);
                        } else if (action === 'redeem') {
                            if (!confirm(langData.confirmRedeem)) return;
                            const tx = await stakeContract.redeemPrincipal(id, { gasLimit: 500000 });
                            await tx.wait();
                            alert(langData.successRedeem);
                        } else if (action === 'early') {
                            if (!confirm(langData.confirmEarly)) return;
                            const tx = await stakeContract.redeemPrincipalEarly(id, { gasLimit: 500000 });
                            await tx.wait();
                            alert(langData.successEarly);
                        }
                        await loadOrders();
                        await updateAllBalances();
                    } catch (e) {
                        alert(langData.errorPrefix + (e.reason || e.message));
                    } finally {
                        this.disabled = false;
                        this.textContent = origText;
                    }
                });
            });
        }

        // ============================================================
        // 事件绑定
        // ============================================================
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentCoin = this.dataset.coin;
                document.getElementById('coinLabel').textContent = currentCoin;
                document.getElementById('currencyDisplay').textContent = currentCoin;
                document.getElementById('stakeAmount').value = '0';
                updateBalance();
                updateRewardPreview();
            });
        });

        document.querySelectorAll('.period-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                currentPeriod = parseInt(this.dataset.period);
                updateRewardPreview();
            });
        });

        document.getElementById('maxBtn').addEventListener('click', () => {
            document.getElementById('stakeAmount').value = document.getElementById('availableBalance').textContent;
            updateRewardPreview();
        });

        document.getElementById('stakeAmount').addEventListener('input', updateRewardPreview);

        stakeBtn.addEventListener('click', async () => {
            alert('质押功能正在开发中，暂未开放');
        });

        // ============================================================
        // 钱包连接
        // ============================================================
        function updateUIForConnected(acc) {
            connectBtn.textContent = `${acc.substring(0,6)}...${acc.substring(acc.length-4)}`;
            connectBtn.classList.add('connected');
        }

        function setDisconnectedUI() {
            connectBtn.textContent = 'Connect wallet';
            connectBtn.classList.remove('connected');
            document.getElementById('availableBalance').textContent = '0.00000';
            document.getElementById('aigcBalance').textContent = '--';
            document.getElementById('usdtBalance').textContent = '--';
            document.getElementById('orderListContainer').innerHTML = renderSkeleton();
        }

        async function connectWallet() {
            if (!window.ethereum) { alert('请安装MetaMask钱包'); return; }
            try {
                showLoading();
                const accounts = await window.ethereum.request({ method: 'eth_requestAccounts' });
                currentAccount = accounts[0];
                provider = new ethers.providers.Web3Provider(window.ethereum);
                signer = provider.getSigner();
                initContracts();
                await fetchChainParams();
                updateUIForConnected(currentAccount);
                await refreshAll();
            } catch (e) {
                alert('连接失败: ' + e.message);
            } finally {
                hideLoading();
            }
        }

        function disconnectWallet() {
            currentAccount = null;
            signer = null;
            provider = null;
            setDisconnectedUI();
            if (countdownTimer) clearInterval(countdownTimer);
        }

        connectBtn.addEventListener('click', () => {
            if (currentAccount) disconnectWallet();
            else connectWallet();
        });

        async function autoConnect() {
            if (!window.ethereum) { connectBtn.textContent = 'No Wallet';
                connectBtn.disabled = true; return; }
            try {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts.length > 0) {
                    currentAccount = accounts[0];
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    initContracts();
                    await fetchChainParams();
                    updateUIForConnected(currentAccount);
                    await refreshAll();
                }
            } catch (e) {}
            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length === 0) disconnectWallet();
                else { currentAccount = accounts[0];
                    provider = new ethers.providers.Web3Provider(window.ethereum);
                    signer = provider.getSigner();
                    initContracts();
                    updateUIForConnected(currentAccount);
                    refreshAll(); }
            });
            window.ethereum.on('chainChanged', () => window.location.reload());
        }

        window.loadOrders = loadOrders;
        window.retryLoadOrder = retryLoadOrder;
        window.addEventListener('load', autoConnect);
        window.addEventListener('beforeunload', () => { if (countdownTimer) clearInterval(countdownTimer); });
    </script>
</body>
</html>
